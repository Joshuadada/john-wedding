<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1F14" />
      <stop offset="50%" stop-color="#1F130E" />
      <stop offset="100%" stop-color="#C85A17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Intertwined Ring Accent -->
  <circle cx="26" cy="24" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.4" />
  <circle cx="38" cy="24" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.4" />

  <!-- Monogram Text: E & J -->
  <text x="32" y="42" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="23" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">E&amp;J</text>

  <!-- Little Heart / Sparkle top center -->
  <path d="M32 10 L33.2 13.8 L37 15 L33.2 16.2 L32 20 L30.8 16.2 L27 15 L30.8 13.8 Z" fill="url(#goldGrad)" />
</svg>